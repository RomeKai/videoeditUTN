[pytest]
DJANGO_SETTINGS_MODULE = backend.settings.ci
python_files = test_*.py
python_classes = Test* *Tests
python_functions = test_*
testpaths = apps
# A test still running after 5 minutes prints the stack of every thread to the
# log and ends the run, so a hang in CI says where it is stuck and fails in
# minutes instead of waiting for the job timeout. No test is meant to take
# that long.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
addopts =
    --strict-markers
    --tb=short
