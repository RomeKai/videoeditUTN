name: CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: onecreator_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d onecreator_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: backend.settings.ci
      DATABASE_URL: postgres://postgres:ci-password@127.0.0.1:5432/onecreator_ci
      SECRET_KEY: ci-only-not-a-secret
      USE_R2: "False"
      AWS_EC2_METADATA_DISABLED: "true"
      OPENAI_API_KEY: test-key-not-valid
      GEMINI_API_KEY: test-key-not-valid
      AYRSHARE_API_KEY: test-key-not-valid
    defaults:
      run:
        working-directory: back
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            back/requirements/base.txt
            back/requirements/dev.txt
            back/requirements/ia.txt
            back/requirements/constraints-ci.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ffmpeg \
            libgl1 \
            libglib2.0-0 \
            libmagic1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade \
            --constraint requirements/constraints-ci.txt \
            pip setuptools wheel
          python -m pip install \
            --constraint requirements/constraints-ci.txt \
            torch torchaudio torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            --constraint requirements/constraints-ci.txt \
            --requirement requirements/dev.txt \
            --requirement requirements/ia.txt
          python -m pip check

      - name: Block external network during quality gates
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          POSTGRES_CONTAINER_IP="$(
            docker inspect \
              --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
              "$POSTGRES_CONTAINER_ID"
          )"
          if [[ -z "$POSTGRES_CONTAINER_IP" ]]; then
            printf 'Could not resolve the PostgreSQL service container IP\n' >&2
            exit 1
          fi

          sudo iptables-save > "$RUNNER_TEMP/iptables.rules"
          sudo ip6tables-save > "$RUNNER_TEMP/ip6tables.rules"
          sudo iptables -F OUTPUT
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT \
            -p tcp -d "$POSTGRES_CONTAINER_IP" --dport 5432 -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -P OUTPUT DROP
          sudo ip6tables -F OUTPUT
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo ip6tables -P OUTPUT DROP

      - name: Run Django system checks
        run: python manage.py check

      - name: Run Django deployment checks
        env:
          DJANGO_SETTINGS_MODULE: backend.settings.prod
          ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: https://example.invalid
        run: python manage.py check --deploy

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Run pytest
        run: >-
          python -m pytest
          --cov=apps
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=test-results.xml

      - name: Restore runner network
        if: ${{ always() }}
        run: |
          if [[ -f "$RUNNER_TEMP/iptables.rules" ]]; then
            sudo iptables-restore < "$RUNNER_TEMP/iptables.rules"
          fi
          if [[ -f "$RUNNER_TEMP/ip6tables.rules" ]]; then
            sudo ip6tables-restore < "$RUNNER_TEMP/ip6tables.rules"
          fi

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: |
            back/coverage.xml
            back/test-results.xml
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Docker build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - web
          - worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.target }} target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./back
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - quality
      - docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$DOCKER_BUILD_RESULT" != "success" ]]; then
            printf 'Required CI failed: quality=%s docker-build=%s\n' \
              "$QUALITY_RESULT" "$DOCKER_BUILD_RESULT"
            exit 1
          fi
