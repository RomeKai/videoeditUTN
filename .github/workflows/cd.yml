name: CD

# INFRA-03 (ADR-006): cada merge a dev despliega staging y cada merge a main,
# producción. Producción espera la aprobación de los reviewers del environment
# "production" (Settings > Environments). Ver documents/runbooks/deploy-vps.md.
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

# Un deploy por rama a la vez y sin cancelar uno a medias: el siguiente espera.
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target:
          - web
          - worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/onecreator-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./back
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Deploy skipped::Faltan secrets del environment:$missing. Las imágenes quedaron publicadas en GHCR; ver documents/runbooks/deploy-vps.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host vps
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CONFIG

      - name: Copy compose file and deploy script
        if: steps.secrets.outputs.ready == 'true'
        run: scp docker-compose.prod.yml deploy/deploy.sh "vps:$DEPLOY_PATH/"

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="sha-${GITHUB_SHA::7}"
          web="ghcr.io/${owner}/onecreator-web:${tag}"
          worker="ghcr.io/${owner}/onecreator-worker:${tag}"
          # Las variables se expanden en el runner a propósito (web, worker, DEPLOY_PATH).
          # shellcheck disable=SC2029
          # El token del job solo vale mientras corre: login, deploy y logout en la misma sesión.
          echo "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin \
            && { bash '$DEPLOY_PATH/deploy.sh' '$web' '$worker'; status=\$?; docker logout ghcr.io; exit \$status; }"

      - name: Remove SSH key
        if: always()
        run: rm -rf ~/.ssh
