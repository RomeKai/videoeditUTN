# Producción en un VPS sin GPU (ADR-006). PoC de ARCH-01.
#
# Diferencias con docker-compose.yml (desarrollo):
#   - settings de producción (backend.settings.prod) y gunicorn en lugar de runserver;
#   - sin bind mounts del código: se corre lo que trae la imagen;
#   - migraciones al arrancar web, restart automático y healthchecks;
#   - la API se publica solo en 127.0.0.1: el TLS lo termina un reverse proxy del host.
#     Ese proxy deja pasar, por ruta, lo mismo que el backend (apps/core/upload_limits.py; el
#     default de 1m de nginx corta todas las subidas). Como en docker/demo/nginx.conf:
#       - crear, from-prompt y el PUT o PATCH de /api/v1/projects/<id>/: MAX_UPLOAD_BYTES (2 GB) más
#         1 MB para el resto del formulario (nginx `client_max_body_size 2049m`; Caddy
#         `request_body { max_size 2049MiB }` con un matcher de esas rutas);
#       - /api/v1/brand-kits/ y /api/v1/brand-kits/<id>/: 113m;
#       - todo lo demás: MAX_REQUEST_BYTES (5m).
#     gunicorn corre workers sync con --timeout 120: un worker que pasa 120 s con un pedido se
#     reinicia, también mientras recibe una subida lenta. nginx guarda el cuerpo entero antes de
#     pasarlo (proxy_request_buffering on, el default), así gunicorn lo recibe en segundos. Caddy no:
#     pasa el cuerpo a medida que llega, y una subida de 2 GB por una conexión lenta mata el worker.
#     Con Caddy (o con nginx sin buffering): workers gthread (`--worker-class gthread --threads 4`,
#     el worker sigue respondiendo mientras un hilo recibe), o un gunicorn aparte con un --timeout
#     largo solo para las rutas de subida, al que el proxy les manda esas rutas.
#
# Uso:
#   cp back/.env.example back/.env.prod   # completar SECRET_KEY, ALLOWED_HOSTS, R2, keys de IA
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-backend_db}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./back
      target: web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn backend.wsgi:application
             --bind 0.0.0.0:8000
             --workers $${GUNICORN_WORKERS:-3}
             --timeout 120
             --access-logfile -"
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./back/.env.prod
    environment: &backend_env
      DJANGO_SETTINGS_MODULE: backend.settings.prod
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-backend_db}
      LOG_SERVICE: web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./back
      target: worker
    restart: unless-stopped
    # Concurrencia baja: el render es CPU bound y comparte RAM con la API (ADR-003, ADR-008).
    command: celery -A backend worker -l info -Q celery,render -c ${CELERY_CONCURRENCY:-2} --max-tasks-per-child=5
    env_file:
      - ./back/.env.prod
    environment:
      <<: *backend_env
      LOG_SERVICE: worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # CELERY_BEAT_SCHEDULE (limpieza de previews, renders trabados) solo corre si hay beat.
  beat:
    build:
      context: ./back
      target: worker
    restart: unless-stopped
    command: celery -A backend beat -l info --schedule /tmp/celerybeat-schedule
    env_file:
      - ./back/.env.prod
    environment:
      <<: *backend_env
      LOG_SERVICE: beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
