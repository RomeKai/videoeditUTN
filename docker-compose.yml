
version: '3.8'

services:
  # --- SERVICIO 1: Base de Datos ---
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=backend_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - "5432:5432"

  # --- SERVICIO 2: Redis (Cola de tareas) ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # --- SERVICIO 3: API Web (Ligera) ---
  web:
    build:
      context: ./back
      target: web
    # Asegúrate que el comando apunte correctamente a donde esté tu manage.py
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./back:/app
    ports:
      - "8000:8000"
    env_file:
      - ./back/.env
    environment:
      # ESTO ES CRUCIAL: Apunta a tu configuración de desarrollo
      - DJANGO_SETTINGS_MODULE=backend.settings.dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # --- SERVICIO 4: Worker IA (Pesado) ---
  worker:
    build:
      context: ./back
      target: worker
    # El comando -A backend es correcto porque tu carpeta se llama 'backend'
    command: celery -A backend worker -l info
    volumes:
      - ./back:/app
    env_file:
      - ./back/.env
    environment:
      # ESTO ARREGLA EL ERROR "ImproperlyConfigured":
      - DJANGO_SETTINGS_MODULE=backend.settings.dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data: