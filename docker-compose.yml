services:
  # --- SERVICE 1: Database ---
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-backend_db}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
    # No host port binding — internal network only (avoids conflict with local Postgres)

  # --- SERVICE 2: Redis (Task queue broker) ---
  redis:
    image: redis:7-alpine
    # No host port binding — internal network only (avoids conflict with local Redis)

  # --- SERVICE 3: Web API ---
  web:
    build:
      context: ./back
      target: web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./back:/app
    ports:
      - "8001:8000"  # host:container — API accessible at localhost:8001
    env_file:
      - ./back/.env
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings.dev
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-backend_db}
    depends_on:
      - db
      - redis

  # --- SERVICE 4: IA Worker (Heavy) ---
  worker:
    build:
      context: ./back
      target: worker
    command: celery -A backend worker -l info
    volumes:
      - ./back:/app
    env_file:
      - ./back/.env
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings.dev
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-backend_db}
    depends_on:
      - db
      - redis

volumes:
  postgres_data: