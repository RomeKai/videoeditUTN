# Proxy de la demo local (docker-compose.demo.yml). No es la configuración de producción.
#
# Deja todo en un solo origen, http://localhost:8080:
#   /api, /admin, /static  -> Django (web:8000)
#   /media                 -> los archivos de back/media, con pedidos por rango (para adelantar un video)
#   el resto               -> la web (front:3000)
#
# Por qué hace falta: con USE_R2=False el backend devuelve URLs /media/... y Django no las sirve.
# Con un solo origen el navegador las pide acá, y tampoco hay CORS de por medio.

server {
    listen 80;
    server_name _;

    # Las subidas van enteras en un pedido: sin tope acá (el backend valida el archivo).
    client_max_body_size 0;

    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "no-store";
    }

    location ~ ^/(api|admin|static)/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La subida pasa directo a Django, sin guardarse antes en el proxy.
        proxy_request_buffering off;
        # Crear un proyecto valida el video y lo mueve antes de responder (la web espera hasta 180 s).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://front:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
