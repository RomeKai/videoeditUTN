# Proxy de la demo local (docker-compose.demo.yml). No es la configuración de producción.
#
# Deja todo en un solo origen, http://localhost:8080:
#   /api, /admin, /static  -> Django (web:8000)
#   /media                 -> los archivos de back/media, con pedidos por rango (para adelantar un video)
#   el resto               -> la web (front:3000)
#
# Por qué: con USE_R2=False el backend devuelve URLs /media/... con el origen del pedido. Como este
# proxy le pasa el Host tal cual, quedan en http://localhost:8080/media/... y las sirve nginx, que
# responde pedidos por rango (el servidor de desarrollo de Django no). Tampoco hay CORS de por medio.
# Solo HTTP: detrás de TLS esas URLs saldrían con http:// y el navegador las bloquearía.

server {
    listen 80;
    server_name _;

    # El DNS de Docker, consultado de nuevo cada 5 s. Con el destino en una variable, nginx resuelve
    # `web` y `front` en cada pedido en vez de una sola vez al arrancar: si se recrea uno de esos
    # contenedores (cambia de IP), el proxy lo encuentra solo, sin 502 ni reinicio.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $web_upstream http://web:8000;
    set $front_upstream http://front:3000;

    # Los topes de peso son los del backend (apps/core/upload_limits.py), por ruta. Con 0 (sin tope) y
    # proxy_request_buffering off, nginx le pasaba a Django pedidos de cualquier tamaño, a cualquier ruta.
    # Así corta antes lo que Django igual rechazaría: un 413 con su página, sin `code` (la web lo muestra
    # igual, junto al archivo). Si cambia un tope del backend, cambia acá también.
    # Lo que no sube archivos: MAX_REQUEST_BYTES (5 MB).
    client_max_body_size 5m;

    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "no-store";
        # El navegador respeta el tipo que manda nginx: un archivo subido nunca se abre como HTML.
        add_header X-Content-Type-Options "nosniff";
    }

    # Las subidas del video van enteras en un pedido: crear, from-prompt y el PUT o PATCH del proyecto.
    # MAX_UPLOAD_BYTES (2 GB = 2048m) más 1 MB para los demás campos del formulario y los separadores
    # del multipart, lo mismo que deja pasar Django. Un archivo apenas más pesado que el tope entra en
    # ese margen y Django responde 413 `file_too_large` con el tope.
    location ~ ^/api/v1/projects/((from-prompt|[0-9a-f-]+)/)?$ {
        client_max_body_size 2049m;
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La subida pasa directo a Django, sin guardarse antes en el proxy.
        proxy_request_buffering off;
        # Crear un proyecto valida el video y lo mueve antes de responder (la web espera hasta 180 s).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Un brand kit: sus archivos juntos (fuentes de 5 MB, logo de 2 MB, intro y outro de 50 MB: 112m)
    # más 1 MB.
    location ~ ^/api/v1/brand-kits/([0-9a-f-]+/)?$ {
        client_max_body_size 113m;
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location ~ ^/(api|admin|static)/ {
        # Sin ruta en proxy_pass: el pedido pasa con su URI tal cual.
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass $front_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
