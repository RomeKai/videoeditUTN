version: '3.9'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: django_backend
    command: ./docker/entrypoint.sh
    volumes:
      - ../:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - db


volumes:
  postgres_data:
