model_list:
  # ROL ARQUITECTO / QA
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # ROL OBRERO (Principal)
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # RESPALDO: Si falla el Obrero, entra Qwen gratis y de forma transparente
  - model_name: gpt-4o-mini
    litellm_params:
      model: openrouter/qwen/qwen-2.5-coder-32b:free
      api_key: os.environ/OPENROUTER_API_KEY